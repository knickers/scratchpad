<!doctype html>
<html lang="en">
	<title>Pad</title>
	<link rel="icon" href="pad.svg">
	<style>
		* { box-sizing: border-box; }
		html {
			background-color: rgb(250, 250, 245);
			height: 100%;
			margin: 0;
			padding: 1rem;
			font-size: 14px;
			font-family: monospace;
		}
		body {
			padding: 2rem;
			min-height: 100%;
			background-color: white;
			color: rgb(56, 56, 56);
			border: 1px solid rgb(200, 200, 200);
		}
	</style>
	<body OnLoad="document.body.focus();" contenteditable spellcheck="false"></body>
</html>
